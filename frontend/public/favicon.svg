<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Wind Stream Gradient -->
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Clean Air Pulse Glow -->
    <linearGradient id="cleanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Upper Wind Trail -->
  <path d="M22 36 C 38 36, 44 32, 54 32 C 64 32, 70 38, 70 44 C 70 50, 64 54, 56 54 C 50 54, 48 50, 50 46"
        fill="none"
        stroke="url(#windGrad)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Lower Wind Trail -->
  <path d="M22 56 C 34 56, 42 60, 52 60 C 62 60, 78 58, 80 48"
        fill="none"
        stroke="url(#windGrad)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#shadow)" />

  <!-- Mid Connecting Stream -->
  <path d="M22 46 C 30 46, 36 46, 42 46"
        fill="none"
        stroke="url(#windGrad)"
        stroke-width="6"
        stroke-linecap="round" />

  <!-- Clean Air Quality Beacon (Green Pulse Indicator) -->
  <circle cx="76" cy="28" r="6.5" fill="url(#cleanGlow)" filter="url(#shadow)" />
  <circle cx="76" cy="28" r="3" fill="#ffffff" />
</svg>
